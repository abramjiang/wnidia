<svg viewBox="0 0 680 264" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>可信引擎的固化边界</title>
<desc>硅片内可固化 L1 身份与完整性、L2 过程存证；固件与外部模型中的 L3 语义裁决不可固化，需保持可升级，其输出交由硅片签名封装。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="40" font-family="sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">可信引擎：什么该固化，什么不该固化</text>

<rect x="40" y="60" width="360" height="152" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="82" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">硅片内 · 可固化</text>
<rect x="60" y="94" width="320" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="220" y="112" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">L1 身份与完整性</text>
<text x="220" y="128" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">哈希 · 签名 · 密钥不出片</text>
<rect x="60" y="152" width="320" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="220" y="170" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">L2 过程存证</text>
<text x="220" y="186" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">证据链 · 时间戳 · 远程证明</text>

<rect x="430" y="60" width="210" height="152" rx="20" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="450" y="82" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">固件 / 外部模型</text>
<rect x="450" y="94" width="170" height="48" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.5"/>
<text x="535" y="112" font-family="sans-serif" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">L3 语义裁决</text>
<text x="535" y="128" font-family="sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">多模型判定 · 可升级</text>
<text x="450" y="162" font-family="sans-serif" font-size="12" fill="#633806">不固化：模型会重训</text>
<text x="450" y="180" font-family="sans-serif" font-size="12" fill="#633806">阈值会调、结论会演进</text>
<text x="450" y="198" font-family="sans-serif" font-size="12" fill="#633806">只把结果交给硅片签名</text>

<path d="M426 118 L406 118" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="40" y="238" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">硬件固化的是「过程不可篡改的证明」，不是「结论正确性的判断」</text>
</svg>
