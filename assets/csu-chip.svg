<svg viewBox="0 0 680 264" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>CSU 芯片模块与软件层映射</title>
<desc>CSU 芯片内含调度引擎、可信引擎、计量引擎、自治引擎四个硬件模块，分别对应软件的三级调度、JEV 校验、计量层与边缘自治；向下经 CXL/PCIe/UCIe 纳管 CPU、GPU、NPU、FPGA。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="40" font-family="sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">CSU 芯片：软件能力硬化为四个模块</text>

<rect x="40" y="60" width="600" height="108" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="60" y="92" width="131" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="125" y="110" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">调度引擎</text>
<text x="125" y="128" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">← 三级调度</text>
<rect x="203" y="92" width="131" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="268" y="110" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">可信引擎</text>
<text x="268" y="128" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">← JEV 校验</text>
<rect x="346" y="92" width="131" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="411" y="110" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">计量引擎</text>
<text x="411" y="128" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">← 计量层</text>
<rect x="489" y="92" width="131" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="554" y="110" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">自治引擎</text>
<text x="554" y="128" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">← 边缘自治</text>

<path d="M340 170 L340 190" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="192" width="600" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="214" font-family="sans-serif" font-size="13" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">向下统一纳管：CPU · GPU · NPU · FPGA（经 CXL / PCIe / UCIe 互联）</text>
</svg>
