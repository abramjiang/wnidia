<svg viewBox="0 0 680 368" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>WNIDIA 系统分层架构</title>
<desc>自上而下五层：门户与看板、调度与编排、推理引擎层、可信与计量、边缘自治；引擎层横跨云边端。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="40" font-family="sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">WNIDIA · 系统分层架构</text>

<rect x="40" y="60" width="600" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="82" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">L4 门户与看板</text>
<text x="620" y="82" font-family="sans-serif" font-size="12" fill="#185FA5" text-anchor="end" dominant-baseline="central">性能前端 · 实时后端 · JEV 评测实时联动</text>

<rect x="40" y="116" width="600" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="60" y="138" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">L3 调度与编排</text>
<text x="620" y="138" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="end" dominant-baseline="central">云边端三级调度 · 引擎选择器</text>

<rect x="40" y="172" width="600" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="60" y="194" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">L2 推理引擎层</text>
<text x="620" y="194" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">Ollama · vLLM · TensorFold（云 / 边 / 端）</text>

<rect x="40" y="228" width="600" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="250" font-family="sans-serif" font-size="13" font-weight="500" fill="#633806" dominant-baseline="central">L1 可信与计量</text>
<text x="620" y="250" font-family="sans-serif" font-size="12" fill="#854F0B" text-anchor="end" dominant-baseline="central">JEV 一致性裁决 · 计量结算（jev_log.jsonl）</text>

<rect x="40" y="284" width="600" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="306" font-family="sans-serif" font-size="13" font-weight="500" fill="#3C3489" dominant-baseline="central">L0 边缘自治</text>
<text x="620" y="306" font-family="sans-serif" font-size="12" fill="#534AB7" text-anchor="end" dominant-baseline="central">中心云中断承接 · 断网本地自治 · 恢复计量回放</text>

<path d="M340 106 L340 114" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 162 L340 170" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 218 L340 226" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 274 L340 282" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
