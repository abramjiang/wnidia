name: selfcheck

# 安全自查 + 核心功能保护：脱敏校验 & 三层 bug 自查
# 运行时层(L3)需要真实服务，CI 中默认跳过，只跑 L1+L2。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sanitize:
    name: 脱敏校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 扫描敏感信息
        run: python3 scripts/sanitize_check.py --dir .

  selfcheck:
    name: 三层 bug 自查 (L1+L2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 语法 / 配置 / 脱敏 自查
        run: python3 scripts/selfcheck.py --skip-runtime
